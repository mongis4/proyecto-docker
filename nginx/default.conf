server {
    # Nginx escucha en el puerto 80
    listen 80;
    server_name _;

    # Tamaño máximo de lo que se puede enviar (formularios, etc.)
    client_max_body_size 10m;

    location / {
        # Reenvía todo al contenedor "web" (Apache) por la red interna de Docker
        proxy_pass http://web:80;
        proxy_http_version 1.1;

        # Pasa a Apache la información original del visitante
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Página de comprobación propia de Nginx: http://localhost/nginx-health
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}