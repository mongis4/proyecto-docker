services:
  # ─── BASE DE DATOS ───────────────────────────────────────
  db:
    image: mysql:8.4 # imagen oficial de MySQL 8
    restart: unless-stopped # se reinicia sola si se cae
    environment: # credenciales leídas del .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tareas}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql # volumen persistente: aquí viven los datos
      - ./app/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro # script inicial
    networks:
      - backend
    healthcheck: # comprueba que MySQL está listo
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── APACHE + PHP (nuestra app) ──────────────────────────
  web:
    build: # se construye con nuestro Dockerfile
      context: .
      dockerfile: apache/Dockerfile
    restart: unless-stopped
    environment: # variables que lee database.php
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-tareas}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy # espera a que MySQL esté "healthy"
    networks:
      - backend # sin "ports": no se publica fuera
    healthcheck: # consulta health.php
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/health.php') === 'ok' ? 0 : 1);",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── NGINX (proxy inverso, puerta de entrada) ────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80" # puerto 80 de tu PC → puerto 80 de Nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend # recibe tráfico de fuera
      - backend # y llega hasta "web"

  # ─── PHPMYADMIN ──────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80" # solo accesible desde tu propio PC
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

volumes:
  mysql_data: # volumen con nombre para MySQL

networks:
  frontend: # red con salida al exterior
  backend:
    internal: true # red interna: sin acceso desde fuera
